- name: new_blog_posts
  label: New blog posts - draft and review
  type: collection
  path: _posts
  format: yaml-frontmatter
  filename: '{year}-{month}-{day}-{title}.html'
  exclude:
  - .gitkeep
  operations:
    create: true
    rename: false
    delete: false
  view:
    primary: title
    sort: date
    order: desc
  fields:
  - name: layout
    type: string
    default: admin-post
    hidden: true
  - name: title
    label: Article title
    type: string
    required: true
  - name: date
    label: Article date
    type: date
    options:
      format: yyyy-MM-dd
  - name: published
    label: Include in owner publication review (live only after owner merge)
    type: boolean
    default: false
  - name: seo_description
    label: Meta description
    type: text
    required: true
  - name: excerpt_text
    label: Blog listing summary
    type: text
    required: true
  - name: featured_image
    label: Featured image
    type: image
  - name: image_alt
    label: Image description
    type: string
  - name: article_body
    label: Article content
    type: rich-text
    options:
      format: html
      switcher: false
